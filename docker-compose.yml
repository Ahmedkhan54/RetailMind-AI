services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: retail_sales_db
      MYSQL_ROOT_PASSWORD: retail_test_password
    ports: ["3306:3306"]
    volumes:
      - ./sql/01_create_database_and_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: retail_test_password
      MYSQL_DATABASE: retail_sales_db
      RETAIL_UPLOAD_STORAGE_DIR: /var/lib/retail-user-uploads
    ports: ["8501:8501"]
    volumes:
      - retail_user_uploads:/var/lib/retail-user-uploads

volumes:
  retail_user_uploads:
